<style>

</defs></svg>
<script>
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={lin:x=>x,out2:x=>1-(1-x)*(1-x),out3:x=>1-Math.pow(1-x,3),out4:x=>1-Math.pow(1-x,4),out5:x=>1-Math.pow(1-x,5),
 in2:x=>x*x,in3:x=>x*x*x,io2:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 back2:x=>{const c1=2.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(p,cls,css,html)=>{const e=document.createElement('div');if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;p.appendChild(e);return e};
const NS='http://www.w3.org/2000/svg';
const sv=(p,tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);p.appendChild(e);return e};
const stage=document.getElementById('stage');
const ICON={heart:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
 chat:'M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z',send:'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z',
 mark:'M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z',play:'M8 5v14l11-7z',check:'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
 layers:'M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z',
 post:'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15h10v2H7zm0-4h10v2H7zm0-4h10v2H7z',
 arrow:'M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z',up:'M7 14l5-5 5 5z'};
const ic=(n,s,c,extra='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="${extra}"><path d="${ICON[n]}" fill="${c}"/></svg>`;

/* ---------- kinetic text ---------- */
function makeText(parent,lines){
 const wrap=$(parent,'abs','pointer-events:none;');
 const out={wrap,lines:[],n:0};
 lines.forEach((L,li)=>{
  const line=$(wrap,'tline','font-weight:'+(L.weight||900)+';letter-spacing:'+(L.ls||'-0.02em')+';font-family:'+(L.font||'Inter')+';'+(L.color?'color:'+L.color+';':''));
  const inn=$(line,'in');line.style.fontSize='100px';
  const chs=[];
  for(const c of L.t){const s=document.createElement('span');s.className='ch'+(L.gold?' gt':'');s.innerHTML=c===' '?'&nbsp;':c;inn.appendChild(s);chs.push(s)}
  const w=inn.getBoundingClientRect().width;
  const size=Math.min(L.max||999,100*L.w/w);
  line.style.fontSize=size+'px';line.style.top=(L.y-size/2)+'px';line.style.height=size+'px';
  out.lines.push({line,chs,L,size,d:L.d||0});
 });
 return out;
}
function animText(tx,T,tin,tout,style){
 const alive=T>=tin-0.01&&T<=tout+0.7;
 tx.wrap.style.display=alive?'block':'none';
 if(!alive)return;
 let k=0;
 tx.lines.forEach((l,li)=>{
  const base=tin+l.d;
  l.chs.forEach((c,ci)=>{
   const dl=base+ci*(style==='slam'?0.018:0.024);
   const ip=seg(T,dl,dl+(style==='slam'?0.42:0.4));
   const op=seg(T,tout+li*0.03,tout+li*0.03+0.2);
   let o=ip*(1-op),ty,sc;
   if(style==='slam'){const e=E.back2(ip);sc=lerp(2.3,1,e);ty=0;o=clamp(ip*6)*(1-op)}
   else{const e=E.out4(ip);ty=(1-e)*90-E.in2(op)*60;sc=1+(1-e)*0.25}
   c.style.opacity=o;c.style.transform='translateY('+ty+'px) scale('+sc+')';
  });
  l.line.style.filter=(T<base+0.35&&T>=base)?'blur('+((1-seg(T,base,base+0.35))*7)+'px)':'none';
 });
}

/* ---------- posts ---------- */
const HEADS=[['NEW!','JUST DROPPED'],['SALE','THIS WEEK ONLY'],['TIP','DAILY TIP'],['HELLO','WE\'RE OPEN'],['WIN!','GIVEAWAY'],['MON.','MOTIVATION'],['LIVE','GOING LIVE'],['DROP','NEW IN'],['FAQ','Q&A TIME'],['SOON','COMING SOON'],['BOOK','NOW BOOKING'],['JOIN','JOIN US']];
function artHTML(v,head,sub){
 const T1=(c,s=74)=>`<div class="tag" style="left:28px;bottom:62px;font-size:${s}px;font-weight:900;letter-spacing:-.02em;color:${c}">${head}</div>`;
 const T2=(c)=>`<div class="tag" style="left:30px;bottom:30px;font-size:24px;color:${c}">${sub}</div>`;
 const fill=(bg)=>`<div style="position:absolute;inset:0;background:${bg}"></div>`;
 switch(v%8){
 case 0:return fill('linear-gradient(135deg,#0B1F4D,#2B4A8B)')+`<div style="position:absolute;right:-50px;top:-60px;width:240px;height:240px;border-radius:50%;background:linear-gradient(135deg,#F7DE9A,#B07F20)"></div>`+T1('#fff')+T2('#E8B84A');
 case 1:return fill('linear-gradient(135deg,#F7DE9A,#E0AD3E 60%,#B07F20)')+`<div style="position:absolute;left:-40px;top:120px;width:560px;height:70px;background:#0B1F4D;transform:rotate(-24deg)"></div>`+T1('#0B1F4D')+T2('#0B1F4D');
 case 2:return fill('#F1F4FB')+['#E8B84A','#5D7DB8','#0B1F4D'].map((c,i)=>`<div style="position:absolute;right:${34+i*64}px;bottom:0;width:48px;height:${120+i*50}px;background:${c};border-radius:12px 12px 0 0"></div>`).join('')+T1('#0B1F4D')+T2('#2B4A8B');
 case 3:return fill('linear-gradient(160deg,#C9D8F2,#F5F8FF)')+`<div style="position:absolute;right:-30px;top:40px;width:230px;height:230px;border-radius:50%;border:28px solid #E8B84A"></div>`+T1('#0B1F4D')+T2('#2B4A8B');
 case 4:return fill('#071231')+`<div style="position:absolute;inset:18px;border:2px solid #E8B84A;border-radius:14px"></div>`+`<div class="tag" style="left:0;right:0;text-align:center;top:104px;font-size:${70}px;font-weight:900;color:#fff;letter-spacing:-.02em">${head}</div><div class="tag" style="left:0;right:0;text-align:center;top:196px;font-size:24px;color:#E8B84A">${sub}</div>`;
 case 5:return fill('linear-gradient(90deg,#0B1F4D 50%,#E8B84A 50%)')+`<div style="position:absolute;right:46px;top:46px;width:130px;height:130px;border-radius:50%;background:#fff;opacity:.9"></div>`+T1('#fff',70)+T2('#9DB4DE');
 case 6:return fill('radial-gradient(circle at 70% 20%,#3F63B0,#0B1F4D 70%)')+fill('repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 14px,rgba(255,255,255,0) 14px 34px)')+T1('#fff')+T2('#F7DE9A');
 default:return fill('radial-gradient(circle at 30% 30%,#FFF3C9,#E8B84A 55%,#B07F20)')+`<div style="position:absolute;left:-60px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:#0B1F4D;opacity:.9"></div>`+`<div class="tag" style="right:28px;top:34px;font-size:${72}px;font-weight:900;color:#0B1F4D;letter-spacing:-.02em">${head}</div><div class="tag" style="right:30px;top:118px;font-size:24px;color:#0B1F4D">${sub}</div>`;
 }
}
function makePost(parent,o){
 const d=o.dark,c=$(parent,'post','background:'+(d?'#0E2459':'#fff'));
 const bc=d?'rgba(157,180,222,.35)':'#D6DCEA',ic1=d?'#fff':'#0B1F4D';
 c.innerHTML=`<div class="ph"><div class="av"></div><div><div class="bar" style="width:150px;background:${bc}"></div><div class="bar" style="width:90px;height:10px;margin-top:8px;background:${bc};opacity:.6"></div></div></div>`+
 `<div class="art">${artHTML(o.v,o.head,o.sub)}</div>`+
 `<div class="pf"><div style="display:flex;gap:16px;align-items:center">${ic('heart',34,o.liked?'#E8B84A':ic1)}${ic('chat',30,ic1)}${ic('send',30,ic1)}<div style="flex:1"></div>${ic('mark',30,ic1)}</div>`+
 `<div class="bar" style="width:120px;margin-top:14px;background:${bc}"></div><div class="bar" style="width:300px;margin-top:10px;background:${bc};opacity:.6"></div></div>`;
 return c;
}

/* ---------- background glow + overlays ---------- */
const glow=$(stage,'abs','background:radial-gradient(520px 520px at 50% 50%,rgba(232,184,74,.16),rgba(232,184,74,0) 70%);');
const scenesLayer=$(stage,'abs','');

/* =============== SCENE 1 : HOOK =============== */
function buildS1(){
 const root=$(scenesLayer,'scene');const cam=$(root,'abs','');
 const rnd=mulberry32(11);const cards=[];const N=40;
 const cols=[[130,260],[540,230],[950,260],[130,720],[540,700],[950,720],[130,1180],[540,1170],[950,1200],[130,1560],[540,1560],[950,1580]];
 for(let i=0;i<N;i++){
  let x,y,sc,rot,t0;
  if(i===0){x=540;y=930;sc=1.5;rot=-3;t0=-0.3}
  else if(i<3){const a=[[170,300],[900,1500]][i-1];x=a[0];y=a[1];sc=.9;rot=i===1?-9:8;t0=-0.1+i*0.05}
  else{const u=(i-3)/(N-4);t0=0.12+0.98*Math.pow(u,1.45);const s=cols[(i*5)%cols.length];x=s[0]+(rnd()-.5)*190;y=s[1]+(rnd()-.5)*230;sc=.62+rnd()*.5;rot=(rnd()-.5)*20}
  const h=HEADS[i%HEADS.length];
  const el=makePost(cam,{v:i+ (i>7?3:0),head:h[0],sub:h[1],dark:(i%3===1),liked:i%4===0});
  cards.push({el,x,y,sc,rot,t0});
 }
 const dim=$(root,'abs','background:#050D24;opacity:0');
 const tx1=makeText(root,[{t:'POSTING',w:900,max:260,gold:true,y:700,weight:900}]);
 const tx2=makeText(root,[{t:'ISN\'T A',w:470,max:150,y:905,weight:800,color:'#fff'},{t:'STRATEGY.',w:900,max:260,y:1075,weight:900,color:'#fff',d:0.1}]);
 const uline=$(root,'','position:absolute;left:190px;top:1195px;width:700px;height:8px;border-radius:4px;background:linear-gradient(90deg,#B07F20,#F7DE9A,#B07F20);transform-origin:0 50%;');
 const impacts=[0.0,1.3,1.95];
 return{root,update(T){
  const Te=Math.min(T,1.2);
  const cz=lerp(1.28,0.93,E.out3(seg(Te,0,1.2)))+(T>1.2?0.07*seg(T,1.2,3.0):0);
  let sx=0,sy=0;for(const im of impacts){const a=Math.max(0,1-(T-im)/0.28);if(T>=im&&a>0){sx+=Math.sin(T*90+im)*14*a*a;sy+=Math.cos(T*70+im*3)*14*a*a}}
  tf(cam,`translate(${sx}px,${sy}px) scale(${cz})`);
  cards.forEach((c,i)=>{
   const p=seg(Te,c.t0,c.t0+0.24);const e=E.back(p);
   const s=c.sc*(0.35+0.65*e);
   const bob=T<1.2?Math.sin(Te*7+i)*5:0;
   c.el.style.opacity=p>0?Math.min(1,p*6):0;
   tf(c.el,`translate(${c.x-200}px,${c.y-250+bob}px) rotate(${c.rot*(0.6+0.4*e)}deg) scale(${s})`);
  });
  const fz=seg(T,1.2,1.55);
  dim.style.opacity=0.86*E.out3(fz);
  root.style.filter='';
  cam.style.filter=T>1.2?'blur('+(6*E.out3(fz))+'px)':'none';
  animText(tx1,T,1.32,3.0,'slam');
  animText(tx2,T,1.98,3.0,'slam');
  const up=E.out4(seg(T,2.3,2.8));uline.style.opacity=up>0?1:0;tf(uline,`scaleX(${up})`);
  // text push
  const push=T>1.3?1+0.035*seg(T,1.3,3.0):1;
  tx1.wrap.style.transform=tx2.wrap.style.transform=uline.style.transform.length?'':'';
  tx1.wrap.style.transform=`scale(${push})`;tx2.wrap.style.transform=`scale(${push})`;tx1.wrap.style.transformOrigin=tx2.wrap.style.transformOrigin='540px 960px';
  uline.style.transform=`scaleX(${up})`;
  // exit zoom through
  const ex=seg(T,2.78,3.28);
  const z=1+E.in3(ex)*1.6;
  root.style.transform=`scale(${z})`;root.style.opacity=1-E.in2(seg(T,2.95,3.25));
  const bl=E.in2(ex)*38;MB.A.setAttribute('stdDeviation',`0 ${bl}`);root.style.filter=bl>0.5?'url(#mbA)':'none';
 },range:[0,3.3]};
}
const tf=(e,s)=>{e.style.transform=s};

/* =============== SCENE 2 : RESEARCH =============== */
function smoothPath(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
 d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function buildS2(){
 const root=$(scenesLayer,'scene');
 const cam=$(root,'abs','perspective:2400px;perspective-origin:540px 1005px;');
 const grp=$(cam,'abs','transform-style:preserve-3d;transform-origin:540px 1005px;');
 const defs=[[50,560,470,330,'AUDIENCE INTERESTS',-260,-120],[560,560,470,330,'COMPETITOR COMPARISON',260,-120],[50,910,470,300,'ENGAGEMENT',-300,60],[560,910,470,300,'CONTENT PERFORMANCE',300,60],[50,1230,980,220,'TRENDS & CONTENT OPPORTUNITIES',0,200]];
 const P=defs.map((d,k)=>{const el=$(grp,'panel',`left:${d[0]}px;top:${d[1]}px;width:${d[2]}px;height:${d[3]}px;`);$(el,'pt','',d[4]);const scan=$(el,'scan','');return{el,scan,x:d[0],y:d[1],w:d[2],h:d[3],dx:d[5],dy:d[6],t0:3.1+k*0.13}});
 // A bars
 const A=P[0].el;const aRows=[['Behind the scenes',82],['How-to tips',68],['Customer stories',57],['Promotions',31]].map((r,i)=>{
  const y=76+i*62;$(A,'','position:absolute;left:28px;top:'+y+'px;font-weight:600;font-size:26px;color:#fff;white-space:nowrap',r[0]);
  const v=$(A,'','position:absolute;right:28px;top:'+y+'px;font-weight:800;font-size:26px;color:#E8B84A','0%');
  $(A,'','position:absolute;left:28px;top:'+(y+36)+'px;width:414px;height:12px;border-radius:6px;background:rgba(255,255,255,.1)');
  const f=$(A,'','position:absolute;left:28px;top:'+(y+36)+'px;width:0;height:12px;border-radius:6px;background:linear-gradient(90deg,#B07F20,#F4CF6E)');return{v,f,pct:r[1]}});
 // B radar
 const B=P[1].el;const rs=sv(sv(B,'svg',{width:470,height:330,style:'position:absolute;left:0;top:0'}),'g',{});
 const svgB=rs.parentNode;const cx=150,cy=196,R=100;
 const ang=i=>(-90+72*i)*Math.PI/180;const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v,cy+Math.sin(ang(i))*R*v];
 [.33,.66,1].forEach(r=>sv(rs,'polygon',{points:[0,1,2,3,4].map(i=>pt(i,r).join(',')).join(' '),fill:'none',stroke:'rgba(157,180,222,.28)','stroke-width':1.5}));
 [0,1,2,3,4].forEach(i=>{const p=pt(i,1);sv(rs,'line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'rgba(157,180,222,.2)','stroke-width':1.5})});
 const series=[{v:[.6,.82,.5,.75,.55],c:'#9DB4DE',f:'rgba(157,180,222,.10)',n:'Brand A'},{v:[.45,.5,.72,.42,.62],c:'#5D7DB8',f:'rgba(93,125,184,.12)',n:'Brand B'},{v:[.88,.7,.82,.68,.92],c:'#E8B84A',f:'rgba(232,184,74,.28)',n:'Your brand'}].map(s=>({...s,poly:sv(rs,'polygon',{points:'',fill:s.f,stroke:s.c,'stroke-width':3.5,'stroke-linejoin':'round'})}));
 series.slice().reverse().forEach((s,i)=>{const y=150+i*56;$(B,'','position:absolute;left:290px;top:'+y+'px;width:18px;height:18px;border-radius:50%;background:'+s.c);$(B,'','position:absolute;left:322px;top:'+(y-6)+'px;font-weight:700;font-size:25px;color:#fff;white-space:nowrap',s.n)});
 // C heatmap
