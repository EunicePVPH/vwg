<!doctype html>
<html><head><meta charset="utf-8">
<title>ProVirtual PH Reel 10</title>
<style>
@font-face{font-family:Mont;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
:root{--n9:#050c1c;--n8:#091735;--n7:#0d2250;--n6:#14306b;--gold:#d7a93f;--gold2:#f2cf78;--gold3:#a77c1f;--ink:#0b1a3a;--slate:#8a9cbb;--paper:#f5f7fb}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--n9);font-family:Inter,sans-serif;color:#fff}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.line{overflow:hidden;text-align:center;white-space:nowrap;line-height:1}
.lin{display:inline-block;font-family:Mont;font-weight:900;letter-spacing:-.01em;line-height:1.08;padding:0 .04em}
.ch{display:inline-block;white-space:pre;will-change:transform}
/* phone */
.bub{position:absolute;left:34px;max-width:520px;background:#262c39;color:#fff;font-size:42px;line-height:1.28;padding:26px 36px;border-radius:44px 44px 44px 12px;font-weight:500}
/* inbox rows */
.row{position:absolute;left:0;width:940px;height:138px;background:#fff;border-radius:26px;box-shadow:0 10px 34px rgba(0,0,0,.28);display:flex;align-items:center;padding:0 34px;color:var(--ink)}
.row .av{width:86px;height:86px;border-radius:50%;color:#fff;font:700 32px Inter;display:flex;align-items:center;justify-content:center;flex:none;margin-right:26px}
.row .rb{flex:1;min-width:0}
.row .r1{display:flex;align-items:center;gap:14px;font-size:34px}
.row .r1 b{font-weight:700;white-space:nowrap}
.row .tag{font-size:19px;letter-spacing:1.2px;font-weight:700;padding:5px 13px;border-radius:999px;background:#E6ECF8;color:#3A5688}
.row .r1 i{margin-left:auto;font-style:normal;font-size:26px;color:#7c8aa6;font-weight:500}
.row .r2{font-size:30px;font-weight:500;color:#26365a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.row .dot{position:absolute;right:30px;bottom:26px;width:22px;height:22px;border-radius:50%;background:var(--gold)}
/* panels */
.panel{position:absolute;left:70px;top:540px;width:940px;border-radius:40px;background:#F4F7FC;box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08);overflow:hidden;color:var(--ink);transform-origin:50% 100%}
.ph{height:112px;display:flex;align-items:center;padding:0 40px;background:#fff;border-bottom:2px solid #E3E8F2;font:800 38px Mont;gap:18px}
.pill{font:800 24px Inter;letter-spacing:1.3px;padding:9px 20px;border-radius:999px;background:var(--gold2);color:#3b2a00}
.pill.blue{background:#DCE6F8;color:#274b8c}.pill.navy{background:var(--n7);color:#fff}
.pill.ok{background:#1d3a74;color:var(--gold2)}
.pbody{padding:34px 40px}
.fld{display:flex;align-items:center;border-bottom:2px solid #E3E8F2;height:96px}
.fld label{width:260px;font:700 25px Inter;letter-spacing:1.4px;color:#7b8cab}
.fld .val{font:600 36px Inter;color:var(--ink)}
.caret{display:inline-block;width:3px;height:.95em;background:var(--gold3);vertical-align:-.12em;margin-left:3px}
.trow{display:flex;align-items:center;height:128px;border-bottom:2px solid #E3E8F2;font:700 37px Inter;gap:26px}
.trow .cb{width:50px;height:50px;border-radius:14px;border:4px solid #B3C0D8;flex:none;display:flex;align-items:center;justify-content:center}
.trow .due{margin-left:auto;font:600 27px Inter;color:#4b5f86;background:#E6ECF8;padding:10px 22px;border-radius:999px;white-space:nowrap}
.rail{position:absolute;left:55px;top:1352px;width:970px;display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
.chip{height:78px;border-radius:24px;border:3px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);display:flex;align-items:center;padding:0 20px;gap:16px;font:600 30px Inter;color:#8fa1c2;white-space:nowrap}
.chip .ic{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.28);flex:none;display:flex;align-items:center;justify-content:center}
.btn{height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;font:800 36px Inter}
.cal{position:absolute;background:#fff;border-radius:34px;box-shadow:0 40px 90px rgba(0,0,0,.5);overflow:hidden;color:var(--ink)}
.ev{position:absolute;border-radius:16px;padding:12px 18px;font:700 28px Inter;color:#fff;overflow:hidden;white-space:nowrap}
.ban{position:absolute;width:860px;height:128px;border-radius:30px;background:rgba(250,251,255,.97);box-shadow:0 30px 70px rgba(0,0,0,.5);display:flex;align-items:center;padding:0 30px;gap:26px;color:var(--ink)}
.ban .bi{width:70px;height:70px;border-radius:20px;flex:none}
.ban b{display:block;font:800 31px Inter}.ban span{font:500 25px Inter;color:#667799}
.card{position:absolute;width:420px;height:250px;border-radius:30px;background:#F7F9FD;box-shadow:0 22px 50px rgba(0,0,0,.45);color:var(--ink);overflow:hidden}
.card .cav{position:absolute;left:28px;top:26px;width:84px;height:84px;border-radius:50%;color:#fff;font:700 31px Inter;display:flex;align-items:center;justify-content:center}
.card .cn{position:absolute;left:132px;top:30px;font:800 36px Inter;white-space:nowrap}
.card .cs{position:absolute;left:132px;top:78px;font:500 26px Inter;color:#667799;white-space:nowrap}
.card .cchip{position:absolute;left:28px;top:140px;font:800 22px Inter;letter-spacing:1.2px;padding:8px 18px;border-radius:999px;white-space:nowrap}
.card .cd{position:absolute;left:28px;top:192px;font:600 28px Inter;color:#35476e;white-space:nowrap}
.colh{position:absolute;font:800 34px Mont;letter-spacing:.3px;white-space:nowrap}
.drow{position:absolute;left:0;width:940px;height:150px;background:#fff;border-radius:30px;display:flex;align-items:center;padding:0 34px;gap:26px;color:var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.drow .av{width:84px;height:84px;border-radius:50%;color:#fff;font:700 31px Inter;display:flex;align-items:center;justify-content:center;flex:none}
.drow .tx{flex:1;min-width:0}.drow .tx b{display:block;font:800 36px Inter}.drow .tx span{font:500 29px Inter;color:#4e6188;white-space:nowrap}
.drow .st{font:800 21px Inter;letter-spacing:1.1px;padding:9px 16px;border-radius:999px;white-space:nowrap}
</style></head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="glowA" class="abs" style="width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(215,169,63,.16),rgba(215,169,63,0) 62%);left:-600px;top:1100px"></div>
  <div id="glowB" class="abs" style="width:1600px;height:1600px;border-radius:50%;background:radial-gradient(circle,rgba(60,110,220,.28),rgba(60,110,220,0) 62%);left:380px;top:-700px"></div>
  <div id="grid" class="abs" style="inset:-100px;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:90px 90px"></div>
  <div id="world" class="abs" style="inset:0"></div>
  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0;pointer-events:none"></div>
  <div id="vig" class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%);pointer-events:none"></div>
  <div id="grain" class="abs" style="inset:-300px;background:url(grain.png);opacity:.07;mix-blend-mode:overlay;pointer-events:none"></div>
</div>
<script>
// ---------- helpers ----------
const W=1080,H=1920;
const $=(s,p=document)=>p.querySelector(s);
function el(tag,cls,parent,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e;}
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const E={lin:x=>x,in2:x=>x*x,in3:x=>x*x*x,out2:x=>1-(1-x)*(1-x),out3:x=>1-Math.pow(1-x,3),out4:x=>1-Math.pow(1-x,4),
 io2:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),back:x=>{const s=1.9;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)},
 backS:x=>{const s=1.1;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};
const P=(t,a,b,f=E.io3)=>f(clamp((t-a)/(b-a)));
const L=(a,b,k)=>a+(b-a)*k;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const reg=[];const on=f=>reg.push(f);
const world=$('#world');
function scene(a,b){const s=el('div','scene',world);s.style.display='block';on(t=>{s.style.display=(t>=a&&t<=b)?'block':'none'});return s}
function fadeOf(t,a,b,c,d){return P(t,a,b,E.lin)*(1-P(t,c,d,E.lin))}
const CHECK=(c='#fff',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.5"/></svg>`;

// kinetic text line
function mkLine(parent,text,o){
  const wrap=el('div','line',parent);const inner=el('div','lin',wrap);
  inner.style.color=o.color||'#fff';if(o.weight)inner.style.fontWeight=o.weight;if(o.family)inner.style.fontFamily=o.family;
  if(o.ls!=null)inner.style.letterSpacing=o.ls+'em';
  inner.style.fontSize='100px';
  const letters=[...text].map((ch,i)=>{const s=el('span','ch',inner);s.textContent=ch;if(o.colorFrom&&i>=o.colorFrom[0])s.style.color=o.colorFrom[1];return s});
  const w=inner.getBoundingClientRect().width;let size=95*(o.fit||900)/w;if(o.max)size=Math.min(size,o.max);
  inner.style.fontSize=size+'px';wrap.style.height=(size*1.12)+'px';wrap.style.paddingTop='0px';
  /* glow disabled: clipped by mask */
  return{wrap,inner,letters,size};
}
function reveal(Ln,tin,o={}){
  const dur=o.dur||.6,stag=o.stag==null?.03:o.stag,tout=o.tout,vis=Ln.wrap;
  const n=Ln.letters.length;
  on(t=>{
    const lastIn=tin+(n-1)*stag+dur;const endT=tout!=null?tout+(n-1)*stag*.6+dur*.7:1e9;
    if(t<tin-.01||t>endT+.02){vis.style.visibility='hidden';return}
    vis.style.visibility='visible';
    for(let i=0;i<n;i++){
      const pin=P(t,tin+i*stag,tin+i*stag+dur,E.outExpo);
      let y=(1-pin)*112;let r=(1-pin)*(o.rot||0);
      if(tout!=null){const po=P(t,tout+i*stag*.6,tout+i*stag*.6+dur*.7,E.in3);y-=po*112;}
      Ln.letters[i].style.transform=`translateY(${y}%) rotate(${r}deg)`;
    }
  });
}
// shake + impacts
const HITS=[[1.5,16],[2.0,9],[8.0,14],[22.0,11]];
function shake(t){let x=0,y=0,z=0;for(const[h,a]of HITS){const d=t-h;if(d>=0&&d<1){const k=Math.exp(-d*9);x+=a*k*Math.sin(d*70);y+=a*k*Math.cos(d*57)*.8;z+=.025*Math.exp(-d*8)*(a/12)}}return[x,y,z]}

// ---------- background motion ----------
on(t=>{
  $('#glowA').style.transform=`translate(${Math.sin(t*.35)*80}px,${Math.cos(t*.3)*60}px)`;
  $('#glowB').style.transform=`translate(${Math.cos(t*.3)*90}px,${Math.sin(t*.4)*70}px)`;
  $('#grid').style.transform=`translateY(${(t*14)%90}px)`;
  const[sx,sy,sz]=shake(t);
  world.style.transform=`translate(${sx}px,${sy}px) scale(${1+sz})`;
  // flashes
  let f=0;
  f+=Math.max(0,.55*Math.exp(-(t-1.5)*14))*(t>=1.5?1:0);
  f+=Math.max(0,.25*Math.exp(-(t-2.0)*12))*(t>=2.0?1:0);
  f+=Math.max(0,.7*Math.exp(-(t-8.0)*10))*(t>=8.0?1:0);
  f+=Math.max(0,.5*Math.exp(-(t-8.82)*16))*(t>=8.82?1:0);
  f+=Math.max(0,.45*Math.exp(-(t-22.0)*9))*(t>=22.0?1:0);
  $('#flash').style.opacity=clamp(f,0,.85);
  const r=rng(Math.floor(t*30)+11);
  $('#grain').style.transform=`translate(${Math.floor(r()*256)}px,${Math.floor(r()*256)}px)`;
});

// ============================================================
// SCENE 1  (0 - 3.1)  THE HOOK
// ============================================================
function buildS1(){
  const s=scene(-.1,3.3);s.style.perspective='2400px';s.style.perspectiveOrigin='540px 900px';
  const rig=el('div','abs',s,'',{left:0,top:0,width:W+'px',height:H+'px',transformOrigin:'540px 700px'});
  const phone=el('div','abs',rig,'',{left:'160px',top:'180px',width:'760px',height:'1560px',borderRadius:'120px',
    background:'linear-gradient(145deg,#33405a,#0a0d16 38%,#1a2030 100%)',boxShadow:'0 0 0 3px #3a465e inset,0 70px 170px rgba(0,0,0,.75),0 0 240px rgba(70,120,230,.28)'});
  const scr=el('div','abs',phone,'',{left:'16px',top:'16px',width:'728px',height:'1528px',borderRadius:'104px',background:'linear-gradient(180deg,#0e1422,#090d17)',overflow:'hidden'});
  // status bar
  el('div','abs',scr,'9:41',{left:'70px',top:'44px',font:'700 32px Inter',color:'#fff'});
  el('div','abs',scr,'<div style="display:flex;gap:6px;align-items:flex-end;height:26px"><i style="width:8px;height:10px;background:#fff;border-radius:2px"></i><i style="width:8px;height:15px;background:#fff;border-radius:2px"></i><i style="width:8px;height:20px;background:#fff;border-radius:2px"></i><i style="width:8px;height:26px;background:#fff;border-radius:2px"></i></div>',{right:'130px',top:'48px'});
  el('div','abs',scr,'<div style="width:54px;height:26px;border:3px solid #fff;border-radius:8px;padding:2px"><div style="width:100%;height:100%;background:#fff;border-radius:3px"></div></div>',{right:'62px',top:'48px'});
  // header
  const hd=el('div','abs',scr,'',{left:0,top:'120px',width:'728px',height:'150px',borderBottom:'2px solid rgba(255,255,255,.08)'});
  el('div','abs',hd,'<svg width="30" height="46" viewBox="0 0 30 46" fill="none" stroke="#6ea0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4L6 23l18 19"/></svg>',{left:'34px',top:'46px'});
  el('div','abs',hd,'JR',{left:'92px',top:'30px',width:'92px',height:'92px',borderRadius:'50%',background:'linear-gradient(145deg,#4f78c4,#1c3a78)',font:'700 34px Inter',display:'flex',alignItems:'center',justifyContent:'center'});
  el('div','abs',hd,'Jamie Rivera',{left:'204px',top:'28px',font:'700 40px Inter'});
  el('div','abs',hd,'New inquiry',{left:'204px',top:'80px',font:'500 28px Inter',color:'#d7a93f'});
  el('div','abs',scr,'Harbor &amp; Pine Studio · Business inbox',{left:0,top:'296px',width:'728px',textAlign:'center',font:'500 25px Inter',color:'#6c7a96'});
  el('div','abs',scr,'Today 9:41 AM',{left:0,top:'346px',width:'728px',textAlign:'center',font:'600 27px Inter',color:'#8a97b2'});
  // typing indicator
  const typ=el('div','abs',scr,'<i></i><i></i><i></i>',{left:'34px',top:'410px',width:'150px',height:'84px',borderRadius:'42px 42px 42px 12px',background:'#262c39',display:'flex',alignItems:'center',justifyContent:'center',gap:'12px'});
  const dots=[...typ.querySelectorAll('i')];dots.forEach(d=>Object.assign(d.style,{width:'16px',height:'16px',borderRadius:'50%',background:'#9aa6bf',display:'block'}));
  const bub=el('div','bub',scr,'Hi! I\'m interested in your services.',{top:'410px',transformOrigin:'0 100%'});
  // input bar
  el('div','abs',scr,'<span style="color:#58667f;font:500 32px Inter">Message</span>',{left:'34px',top:'1380px',width:'660px',height:'86px',borderRadius:'43px',border:'2px solid rgba(255,255,255,.12)',display:'flex',alignItems:'center',padding:'0 34px'});
  // notification banner
  const ban=el('div','abs',scr,'',{left:'20px',top:'34px',width:'688px',height:'168px',borderRadius:'44px',background:'rgba(48,56,74,.96)',boxShadow:'0 24px 60px rgba(0,0,0,.6)',transformOrigin:'50% 50%'});
  el('div','abs',ban,'<svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h16a2 2 0 012 2v10a2 2 0 01-2 2H9l-5 4v-4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>',{left:'28px',top:'34px',width:'84px',height:'84px',borderRadius:'24px',background:'linear-gradient(145deg,#e8c367,#b98a22)',display:'flex',alignItems:'center',justifyContent:'center'});
  el('div','abs',ban,'MESSAGES',{left:'136px',top:'26px',font:'700 22px Inter',letterSpacing:'1.5px',color:'#9aa8c4'});
  el('div','abs',ban,'now',{right:'30px',top:'24px',font:'500 24px Inter',color:'#9aa8c4'});
  el('div','abs',ban,'Jamie Rivera',{left:'136px',top:'58px',font:'700 36px Inter'});
  el('div','abs',ban,'Hi! I\'m interested in your services.',{left:'136px',top:'106px',font:'500 28px Inter',color:'#dfe6f5',whiteSpace:'nowrap'});
  const ring=el('div','abs',scr,'',{left:'20px',top:'34px',width:'688px',height:'168px',borderRadius:'44px',border:'6px solid #f2cf78',opacity:0});
  const ring2=el('div','abs',scr,'',{left:'20px',top:'34px',width:'688px',height:'168px',borderRadius:'44px',border:'4px solid #f2cf78',opacity:0});
  // glass sheen
  const sheen=el('div','abs',scr,'',{inset:0,background:'linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 45%,rgba(255,255,255,0) 60%)'});
  // dim + type
  const dim=el('div','abs',s,'',{inset:0,background:'radial-gradient(ellipse at 50% 50%,rgba(5,12,28,.82),rgba(5,12,28,.94))',opacity:0});
  const tb=el('div','abs',s,'',{left:'70px',top:'560px',width:'940px',display:'flex',flexDirection:'column',alignItems:'center',gap:'0px'});
  const l1=mkLine(tb,'THEY',{fit:900,max:300});
  const l2=mkLine(tb,'INQUIRED.',{fit:940});
  const sp=el('div','',tb,'',{height:'46px'});
  const l3=mkLine(tb,'DID YOU',{fit:600,color:'#f2cf78',glow:'0 0 40px rgba(242,207,120,.35)'});
  const l4=mkLine(tb,'FOLLOW UP?',{fit:940,color:'#f2cf78',glow:'0 0 40px rgba(242,207,120,.35)'});
  reveal(l1,1.5,{dur:.45,stag:.05,tout:2.8});reveal(l2,1.58,{dur:.5,stag:.03,tout:2.82});
  reveal(l3,2.0,{dur:.45,stag:.04,tout:2.85});reveal(l4,2.06,{dur:.5,stag:.03,tout:2.88});
  // gold rule that draws under the type
  const rule=el('div','abs',s,'',{left:'70px',top:'1290px',width:'940px',height:'6px',background:'linear-gradient(90deg,transparent,#f2cf78,transparent)',transformOrigin:'50% 50%',opacity:0});
  on(t=>{
    const fz=1.5; // freeze moment
    const mt=Math.min(t,fz);                    // motion clock stops at the freeze
    // camera push-in
    const k=L(1.22,1.58,E.out3(clamp(mt/fz)));
    const dy=L(250,330,E.out3(clamp(mt/fz)));
    const drift=t>fz?(t-fz)*.012:0;
    const ry=L(-14,0,E.out3(clamp(mt/1.4))),rx=L(7,0,E.out3(clamp(mt/1.4))),rz=L(-4,-.5,E.out3(clamp(mt/fz)));
    let jx=0,jy=0;
    if(t>=fz&&t<fz+.13){const r=rng(Math.floor(t*30)*7);jx=(r()-.5)*40;jy=(r()-.5)*24}
    rig.style.transform=`translate(${jx}px,${dy+jy}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${k+drift})`;
    const dimP=P(t,fz,fz+.25,E.out2);
    rig.style.filter=t>=fz?`grayscale(${.85*dimP}) brightness(${1-.55*dimP}) blur(${5*dimP}px)`:'none';
    dim.style.opacity=dimP;
    // typing dots
    const tp=clamp((t-.1)/.4);
    typ.style.opacity=(t>=.1&&t<.5)?1:0;
