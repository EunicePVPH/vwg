<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;background:#050d20}
.a{position:absolute}
.nw{white-space:nowrap}
.panel{position:absolute;background:linear-gradient(180deg,#ffffff 0%,#f0f3f9 100%);border-radius:44px;box-shadow:0 90px 150px -30px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.5);overflow:hidden;color:#0a1e47}
.over{font-weight:800;font-size:22px;letter-spacing:.22em;color:#b8862f;white-space:nowrap}
.ttl{font-weight:800;font-size:46px;letter-spacing:-.01em;color:#0a1e47;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;font-weight:800;font-size:20px;letter-spacing:.08em;white-space:nowrap}
.gold{background:linear-gradient(180deg,#f6dc98,#d9a94c);color:#0a1e47}
.navy{background:#0c2352;color:#fff}
.slate{background:#e3e9f3;color:#43557a}
.ghost{border:2.5px solid #d9ae5a;color:#9a6f1f;background:#fff8e6}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;border:3px solid #fff}
.gt{background:linear-gradient(180deg,#fbe9b4 0%,#e0b660 46%,#b98a33 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#fff;border:2px solid #e4eaf4;border-radius:26px;box-shadow:0 10px 24px -12px rgba(10,30,71,.25)}
.ic{display:flex;align-items:center;justify-content:center;border-radius:50%}
.ic svg{width:60%;height:60%}
.lbl{font-weight:700;font-size:21px;letter-spacing:.14em;color:#5e6e8f;white-space:nowrap}
.pill{border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;letter-spacing:.14em;border:2px solid rgba(255,255,255,.28);overflow:hidden;background:rgba(6,18,46,.82)}
</style></head>
<body><svg width="0" height="0" style="position:absolute"><defs><filter id="mbA" x="-35%" y="-10%" width="170%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbAg" stdDeviation="0 0"/></filter><filter id="mbB" x="-35%" y="-10%" width="170%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbBg" stdDeviation="0 0"/></filter></defs></svg><div id="stage"></div>
<script>
// ───────────────────────── helpers
const W=1080,H=1920;
const stage=document.getElementById('stage');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>1-(1-t)*(1-t),eo3=t=>1-Math.pow(1-t,3),eo4=t=>1-Math.pow(1-t,4),eo5=t=>1-Math.pow(1-t,5);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eio2=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eob=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(t,a,d,f=eo3)=>f(clamp((t-a)/d));
const lin=(t,a,d)=>clamp((t-a)/d);
function mk(parent,cls,html,st){const d=document.createElement('div');if(cls)d.className=cls;if(html!=null&&html!=='')d.innerHTML=html;if(st)Object.assign(d.style,st);parent.appendChild(d);return d}
function box(parent,x,y,w,h,cls,html,st){return mk(parent,'a '+(cls||''),html,Object.assign({left:x+'px',top:y+'px',width:w+'px',height:h+'px'},st||{}))}
function T(e,o){const x=o.x||0,y=o.y||0,s=o.s==null?1:o.s,r=o.r||0,rx=o.rx||0,ry=o.ry||0,op=o.o==null?1:o.o,b=o.b||0,sx=o.sx==null?s:o.sx,sy=o.sy==null?s:o.sy;
 e.style.transform=(rx||ry?'perspective(1800px) ':'')+`translate(${x}px,${y}px) `+(rx?`rotateX(${rx}deg) `:'')+(ry?`rotateY(${ry}deg) `:'')+(r?`rotate(${r}deg) `:'')+`scale(${sx},${sy})`;
 e.style.opacity=op;e.style.visibility=op<.003?'hidden':'visible';let fl='';if(b>.3)fl+=`blur(${b.toFixed(1)}px) `;if(o.bx>.4){document.getElementById('mb'+o.bf+'g').setAttribute('stdDeviation',o.bx.toFixed(1)+' 0');fl+=`url(#mb${o.bf})`}e.style.filter=fl.trim()}
const vx=(f,t)=>Math.min(45,Math.abs(f(t+.004)-f(t-.004))/.008*.0017);
function show(e,on){e.style.display=on?'block':'none'}
// icons
const IC={
 check:c=>`<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 clock:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M12 7v5.3l3.4 2" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 arrow:c=>`<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 prog:c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="${c}"/></svg>`,
 cal:c=>`<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
 doc:c=>`<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
 list:c=>`<svg viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><path d="M3.5 7l1.3 1.3L7 6M3.5 12l1.3 1.3L7 11M3.5 17l1.3 1.3L7 16" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 flag:c=>`<svg viewBox="0 0 24 24"><path d="M6 21V4M6 5h12l-2.5 4L18 13H6" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 search:c=>`<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="${c}" stroke-width="2.8" stroke-linecap="round"/></svg>`,
 chat:c=>`<svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4.5 4v-4H4z" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/></svg>`,
 layers:c=>`<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 17l9 5 9-5" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
 flow:c=>`<svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.6" fill="${c}"/><circle cx="19" cy="6" r="2.6" fill="${c}"/><circle cx="12" cy="19" r="2.6" fill="${c}"/><path d="M5 6h14M5 6l7 13M19 6l-7 13" stroke="${c}" stroke-width="1.8" fill="none"/></svg>`,
 chk2:c=>`<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M8 12.2l3 3 5-6" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 report:c=>`<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="${c}" stroke-width="2.3"/><path d="M8 16v-4M12 16V8M16 16v-6" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></svg>`,
};
function fitText(el,w){const sp=el.firstElementChild||el;el.style.fontSize='100px';const r=sp.getBoundingClientRect().width;el.style.fontSize=(100*w/r)+'px';return 100*w/r}
function bigLine(parent,text,cls,fitW,cy,extra){const wrap=box(parent,0,cy,W,0,'',null,{display:'flex',justifyContent:'center',alignItems:'center'});
 const sp=mk(wrap,'nw '+cls,text,Object.assign({fontWeight:900,lineHeight:1,letterSpacing:'-.02em',display:'inline-block'},extra||{}));
 wrap.style.fontSize='100px';const r=sp.getBoundingClientRect().width;sp.style.fontSize=(100*fitW/r)+'px';return wrap}

// ───────────────────────── persistent background
const bg=box(stage,0,0,W,H,'',null,{background:'radial-gradient(130% 75% at 50% 28%,#10295c 0%,#091a3d 45%,#040b1c 100%)'});
const floor=box(bg,-1200,1060,3480,3400,'',null,{backgroundImage:'linear-gradient(rgba(150,175,230,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(150,175,230,.10) 2px,transparent 2px)',backgroundSize:'120px 120px',transform:'perspective(900px) rotateX(72deg)',transformOrigin:'50% 0%',WebkitMaskImage:'linear-gradient(to bottom,transparent 0%,#000 45%,#000 100%)'});
const glowG=box(bg,0,0,1500,1500,'',null,{background:'radial-gradient(circle,rgba(217,174,90,.30) 0%,rgba(217,174,90,.08) 40%,transparent 68%)'});
const glowB=box(bg,0,0,1700,1700,'',null,{background:'radial-gradient(circle,rgba(60,100,190,.30) 0%,rgba(40,70,150,.08) 45%,transparent 70%)'});
const vig=box(stage,0,0,W,H,'',null,{background:'radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(2,6,16,.65) 100%)',pointerEvents:'none'});
function updBG(t){floor.style.backgroundPosition=`0px ${(t*90)%120}px`;
 T(glowG,{x:lerp(280,640,t/25)-250,y:lerp(-420,-120,Math.sin(t*.35)*.5+.5)-250,o:.9});
 T(glowB,{x:lerp(-700,-380,t/25)+0,y:lerp(900,1150,Math.cos(t*.3)*.5+.5)-300,o:1})}

// ───────────────────────── weekday strip
let stripRoot;const strip=(()=>{const root=box(stage,90,238,900,96,'');stripRoot=root;const names=['MON','TUE','WED','THU','FRI'];const ps=[];
 names.forEach((d,i)=>{const p=box(root,i*183,0,168,64,'pill');const g=box(p,0,0,168,64,'',null,{background:'linear-gradient(180deg,#f8e3a6,#d9a94c)',opacity:0});const tx=mk(p,'nw',d,{position:'relative'});const ck=box(p,138,22,20,20,'ic',IC.check('#d9ae5a'),{opacity:0});ps.push({p,g,tx,ck})});
 const track=box(root,0,82,900,6,'',null,{background:'rgba(255,255,255,.14)',borderRadius:'3px'});
 const fill=box(track,0,0,900,6,'',null,{background:'linear-gradient(90deg,#b98a33,#f6dc98)',borderRadius:'3px',transformOrigin:'0 50%'});
 const B=[3.0,5.5,8.0,11.0,14.0,17.4];
 return t=>{const inn=P(t,2.9,.45,eo3),out=P(t,19.3,.45,eio);T(root,{y:(1-inn)*-60-out*40,o:inn*(1-out)});
  let tot=0;
  ps.forEach((q,i)=>{const cur=P(t,B[i]-.12,.3,eio)*(1-P(t,B[i+1]-.12,.3,eio)),done=P(t,B[i+1]-.12,.3,eio);
   q.g.style.opacity=cur;q.p.style.borderColor=`rgba(255,255,255,${.22+.2*done})`;q.p.style.transform=`scale(${1+.07*cur})`;
   q.tx.style.color=cur>.5?'#0a1e47':'#fff';q.tx.style.opacity=.38+.62*Math.max(cur,done);q.ck.style.opacity=done*.95;
   tot+=clamp((t-B[i])/(B[i+1]-B[i]))});
  fill.style.transform=`scaleX(${clamp(tot/5)})`}})();

// ───────────────────────── sweeps / flash / grain
const SW=[2.8,5.35,7.9,10.95,13.85,19.55,21.3];
const sweeps=SW.map(t0=>({t0,e:box(stage,0,-300,340,2600,'',null,{background:'linear-gradient(90deg,transparent 0%,rgba(255,224,150,.0) 15%,rgba(255,229,160,.55) 50%,rgba(255,224,150,.0) 85%,transparent 100%)',mixBlendMode:'screen',transform:'rotate(16deg)',visibility:'hidden',opacity:.6})}));
const flash=box(stage,0,0,W,H,'',null,{background:'#fff',opacity:0,pointerEvents:'none'});
const flashG=box(stage,0,0,W,H,'',null,{background:'radial-gradient(ellipse 75% 55% at 50% 48%,rgba(255,243,207,.95) 0%,rgba(240,207,132,.75) 32%,rgba(217,174,90,.28) 62%,transparent 85%)',opacity:0,pointerEvents:'none'});
const grain=box(stage,0,0,W,H,'',null,{opacity:.07,mixBlendMode:'overlay',pointerEvents:'none'});
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);let s=12345;for(let i=0;i<d.data.length;i+=4){s=(s*1664525+1013904223)>>>0;const v=(s>>>24);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);grain.style.backgroundImage=`url(${c.toDataURL()})`})();
function updFX(t){t=Math.max(t,0);
 sweeps.forEach(s=>{const p=lin(t,s.t0,.65);const v=p>0&&p<1;s.e.style.visibility=v?'visible':'hidden';if(v)s.e.style.transform=`translateX(${lerp(-700,1500,eio2(p))}px) rotate(16deg)`});
 let f=.5*Math.exp(-t*13);if(t>1.18)f+=.5*Math.exp(-(t-1.18)*14);if(t>1.42)f+=.22*Math.exp(-(t-1.42)*14);if(t>3.0)f+=.28*Math.exp(-(t-3.0)*10);if(t>20.0)f+=.35*Math.exp(-(t-20.0)*9);
 if(t>12.9&&t<13.4)f+=.12*Math.exp(-(t-12.9)*12);
 flash.style.opacity=clamp(f,0,1);
 flashG.style.opacity=P(t,19.55,.2,eo2)*(1-P(t,19.95,.3,eo2));
 const fr=Math.floor(t*30+.001);grain.style.backgroundPosition=`${(fr*97)%256}px ${(fr*61)%256}px`}

// ───────────────────────── kinetic word stack
function wordStack(root,words,x,y0,fs,lh,times,tEnd){
 const els=words.map((w,i)=>{const wrap=box(root,x,y0+i*lh,990-x+90,lh,'',null,{overflow:'hidden'});const inner=mk(wrap,'nw',`${w}<span class="gt">.</span>`,{fontWeight:900,fontSize:fs+'px',lineHeight:lh+'px',letterSpacing:'-.02em',textShadow:'0 8px 30px rgba(0,0,0,.45)'});
  const bar=box(root,x-34,y0+i*lh+lh*.22,10,lh*.56,'',null,{background:'linear-gradient(180deg,#f6dc98,#b98a33)',borderRadius:'5px',opacity:0});
  return {wrap,inner,bar}});
 return t=>{els.forEach((e,i)=>{const p=P(t,times[i],.5,eo4);const nxt=i<times.length-1?P(t,times[i+1],.35,eo2):0;const out=P(t,tEnd,.35,eio);
   T(e.inner,{y:(1-p)*lh*1.05+out*-lh*.9,o:Math.min(1,p*3)*(1-.62*nxt)*(1-out)});e.bar.style.opacity=(p>0?1:0)*(1-nxt)*(1-out);e.bar.style.transform=`scaleY(${p})`})}}

// ───────────────────────── day title slam
function dayTitle(root,label,cy){const band=box(root,0,cy-190,W,380,'',null,{background:'linear-gradient(180deg,transparent,rgba(4,11,28,.9) 28%,rgba(4,11,28,.9) 72%,transparent)'});const wrap=bigLine(root,label,'',900,cy,{color:'#fff',textShadow:'0 14px 60px rgba(0,0,0,.6)'});const ln=box(root,90,cy+120,900,10,'',null,{background:'linear-gradient(90deg,#b98a33,#f6dc98,#b98a33)',borderRadius:'5px',transformOrigin:'0 50%'});
 const sp=wrap.firstElementChild;sp.style.letterSpacing='.01em';
 const fn=(t,t0)=>{const p=P(t,t0,.38,eo5),out=P(t,t0+.58,.32,eio);T(band,{o:p*(1-out)});T(wrap,{s:lerp(1.35,1,p)*(1+out*.12),y:out*-90,o:Math.min(1,p*4)*(1-out),b:(1-p)*22+out*8});
  T(ln,{sx:p*(1-out*0),y:out*-90,o:p*(1-out)})};fn.els=[band,wrap,ln];return fn}

// ───────────────────────── S1  HOOK  (0–3.2)
const S1=(()=>{const root=box(stage,0,0,W,H);
 const wsp=box(root,70,250,940,1500,'',null,{background:'linear-gradient(180deg,#16356f,#0d2553)',borderRadius:'50px',opacity:.8,filter:'blur(9px)'});
 box(wsp,0,0,250,1500,'',null,{background:'rgba(255,255,255,.07)',borderRadius:'50px 0 0 50px'});
 for(let i=0;i<10;i++){const r=box(wsp,290,50+i*140,600,100,'',null,{background:'rgba(255,255,255,.1)',borderRadius:'20px'});box(r,24,24,52,52,'',null,{background:'rgba(255,255,255,.25)',borderRadius:'50%'});box(r,100,26,300,18,'',null,{background:'rgba(255,255,255,.3)',borderRadius:'9px'});box(r,100,58,420,14,'',null,{background:'rgba(255,255,255,.18)',borderRadius:'7px'});
  if(i<5)box(wsp,40,60+i*70,170,24,'',null,{background:'rgba(255,255,255,.18)',borderRadius:'10px'})}
 const N=[{n:'Maya R. · Client',i:'M',tx:'Any update?',c:'#12336f',t0:.06,x:-14,y:370,r:-2.2},
 {n:'Jon D. · Client',i:'J',tx:'Is this finished?',c:'#b8862f',t0:.36,x:26,y:520,r:1.8},
 {n:'Ana L. · Partner',i:'A',tx:"What's the status?",c:'#5e6e8f',t0:.64,x:-20,y:670,r:-1.5},
 {n:'Maya R. · Client',i:'M',tx:'Any update?',c:'#12336f',t0:.9,x:22,y:820,r:2.6},
 {n:'Sam K. · Team',i:'S',tx:'Status check?',c:'#b8862f',t0:1.04,x:-8,y:970,r:-2.4}];
 const ne=N.map(n=>{const e=box(root,100,0,880,142,'',null,{background:'rgba(255,255,255,.97)',borderRadius:'38px',boxShadow:'0 30px 60px -10px rgba(0,0,0,.55)'});
  box(e,26,26,90,90,'ic',`<span style="font-weight:800;font-size:40px;color:#fff">${n.i}</span>`,{background:n.c});
  box(e,142,24,500,30,'',`<span class="nw" style="font-weight:700;font-size:25px;color:#6a7a9b">${n.n}</span>`);
  box(e,142,60,700,64,'',`<span class="nw" style="font-weight:800;font-size:46px;color:#0a1e47;letter-spacing:-.01em">${n.tx}</span>`);
  box(e,740,26,110,30,'',`<span class="nw" style="font-weight:600;font-size:22px;color:#8794b0;display:block;text-align:right">now</span>`);
  box(e,830,56,26,26,'',null,{background:'#d9ae5a',borderRadius:'50%'});return e});
 const lock=box(root,0,0,W,H);
 const L1=bigLine(lock,'STOP','',940,690,{color:'#fff',textShadow:'0 20px 80px rgba(0,0,0,.65)'});
 const L2=bigLine(lock,'CHASING','',940,945,{color:'#fff',textShadow:'0 16px 60px rgba(0,0,0,.65)'});
 const L3=bigLine(lock,'UPDATES.','gt',940,1128,{});
 const U=box(lock,70,1218,940,12,'',null,{background:'linear-gradient(90deg,#b98a33,#f6dc98,#b98a33)',borderRadius:'6px',transformOrigin:'0 50%'});
 const shk=(t)=>{let s=0;[[0,16],[1.18,20],[1.42,12]].forEach(([t0,A])=>{if(t>t0){const d=t-t0;s+=A*Math.exp(-d*9)*Math.sin(d*75)}});return s};
 return t=>{show(root,t<3.3);if(t>=3.3)return;const s=shk(t);T(root,{x:s*.9,y:s*.6,s:1+.022*(t/3)});
  N.forEach((n,i)=>{const p=P(t,n.t0,.4,eob),out=P(t,1.12,.4,eio);T(ne[i],{x:n.x,y:n.y+(1-p)*150-out*70-i*0,s:lerp(.84,1,p)*(1-out*.2),r:n.r,o:clamp(p*2.5)*(1-out*.72),b:out*9})});
  const p1=P(t,1.18,.3,eo5),p2=P(t,1.42,.34,eo5),p3=P(t,1.92,.38,eo3),ex=P(t,2.8,.35,eio);
  T(L1,{s:lerp(2.5,1,p1),o:clamp(p1*4),b:(1-p1)*26});
  T(L2,{x:(1-p2)*320,s:lerp(1.22,1,p2),o:clamp(p2*4),b:(1-p2)*20});
  L3.firstElementChild.style.clipPath=`inset(-20% ${(1-p3)*101}% -20% -2%)`;T(L3,{o:p3>0?1:0,s:lerp(1.04,1,p3)});
  T(U,{sx:P(t,2.12,.5,eo4),o:t>2.12?1:0});
  T(lock,{s:1+ex*.55,o:1-ex,b:ex*18,y:ex*-60})}})();

// ───────────────────────── panel header helper
function pHead(p,over,title,chipHtml){box(p,36,30,500,30,'',`<div class="over">${over}</div>`);box(p,36,62,700,64,'',`<div class="ttl">${title}</div>`);if(chipHtml)box(p,0,40,864,50,'',chipHtml,{display:'flex',justifyContent:'flex-end'})}
function pFoot(p,y,txt){box(p,36,y,820,40,'',`<div class="nw" style="font-weight:700;font-size:22px;color:#6a7a9b;display:flex;align-items:center;gap:12px"><span style="width:14px;height:14px;border-radius:50%;background:#d9ae5a;display:inline-block"></span>${txt}</div>`)}

// ───────────────────────── S2  MONDAY + TUESDAY  (3.0–8.3)
const S2=(()=>{const root=box(stage,0,0,W,H);
 const dMon=dayTitle(root,'MONDAY',760),dTue=dayTitle(root,'TUESDAY',760);
