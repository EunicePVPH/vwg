}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#050B1E;overflow:hidden}
body{font-family:'Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#050B1E}
canvas#bg,canvas#fxc{position:absolute;left:0;top:0;width:1080px;height:1920px}

#ov{position:absolute;left:0;top:0;width:1080px;height:1920px}
#beam{position:absolute;left:0;top:0;width:1080px;height:260px;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(244,216,138,0) 0%,rgba(244,216,138,.10) 70%,rgba(255,236,170,.55) 96%,rgba(255,250,225,.95) 99%,rgba(255,250,225,0) 100%)}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;
  background:radial-gradient(ellipse 85% 70% at 50% 50%,rgba(2,6,18,0) 55%,rgba(2,6,18,.62) 100%)}
#grain{position:absolute;left:-40px;top:-40px;width:1160px;height:2000px;opacity:.07;mix-blend-mode:overlay;pointer-events:none;image-rendering:auto}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 50%,#fffbe8 0%,#ffe6a0 45%,rgba(255,220,130,.0) 100%)}

/* ---------- typography ---------- */
.cap{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
.cl{overflow:hidden;padding:.05em .08em .07em;line-height:.98;display:block}
.ci{display:inline-block;white-space:nowrap;font-family:'Montserrat',sans-serif;font-weight:900;letter-spacing:-.025em;text-transform:uppercase;color:#fff;will-change:transform}
.gold{background-image:linear-gradient(180deg,#FFF1BF 0%,#F2CB63 36%,#D9A93E 62%,#A77A1F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.glowg{filter:drop-shadow(0 0 26px rgba(217,169,62,.45))}
.glitch{text-shadow:-7px 0 rgba(70,140,255,.75),7px 0 rgba(217,169,62,.75)}

/* ---------- windows / cards ---------- */
.win{position:absolute;border-radius:34px;overflow:hidden;
  background:linear-gradient(160deg,#112653 0%,#0A1736 55%,#071029 100%);
  border:1.5px solid rgba(160,185,240,.20);

.dots{display:flex;gap:9px}.dots i{width:15px;height:15px;border-radius:50%;background:rgba(160,185,240,.30);display:block}
.dots i:first-child{background:var(--gold)}
.wtitle{font-family:'Inter';font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--slate);text-transform:uppercase}

.card{position:absolute;overflow:hidden;border-radius:26px;

.card .meta{position:absolute;left:106px;top:20px;right:18px}
.card .nm{font-family:'Montserrat';font-weight:700;font-size:29px;line-height:1.12;color:#fff}

.card .bars{position:absolute;left:22px;right:22px;bottom:20px}

  font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#DDE6FF;opacity:0;white-space:nowrap}
.card .chk{position:absolute;right:16px;top:14px;width:46px;height:46px;border-radius:50%;

.card.b .fav{position:absolute;left:22px;top:24px;width:30px;height:30px;border-radius:50%;background:rgba(150,178,240,.35)}

.card.f .box{position:absolute;left:20px;top:20px;width:34px;height:34px;border-radius:9px;border:2.5px solid rgba(150,178,240,.45)}

.card.f .q{position:absolute;right:18px;top:16px;padding:6px 14px;border-radius:16px;background:rgba(150,178,240,.2);font-weight:700;font-size:20px;color:var(--slate)}

#win1 .tabs{display:flex;gap:8px;padding:16px 20px 0;height:62px;background:rgba(255,255,255,.035)}
#win1 .tab{padding:11px 20px;border-radius:14px 14px 0 0;background:rgba(150,178,240,.10);font-weight:600;font-size:19px;color:var(--slate);white-space:nowrap}

#win1 .addr{margin:20px 24px 0;height:84px;border-radius:44px;background:rgba(5,12,32,.85);border:1.5px solid rgba(160,185,240,.28);display:flex;align-items:center;padding:0 30px;gap:18px}
#win1 .typed{font-weight:500;font-size:34px;color:#fff;white-space:nowrap}
#win1 .caret{display:inline-block;width:3px;height:40px;background:var(--gold);margin-left:-14px}
#win1 .owner{margin:18px 24px 0;display:flex;align-items:center;gap:18px}

#win1 .owner b{display:block;font-family:'Montserrat';font-weight:700;font-size:23px;letter-spacing:.04em}

/* ---------- ICP / stepper / HUD ---------- */
.glass{position:absolute;border-radius:26px;background:linear-gradient(160deg,rgba(14,32,76,.94),rgba(7,17,42,.94));
  border:1.5px solid rgba(160,185,240,.22);box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
#icp{left:60px;top:666px;width:960px;height:186px;opacity:0}

.chip{position:absolute;height:58px;border-radius:30px;border:1.5px solid rgba(160,185,240,.28);background:rgba(150,178,240,.08);

#stepper{left:60px;top:556px;width:960px;height:84px;opacity:0}
.stp{position:absolute;top:0;height:84px;border-radius:42px;display:flex;align-items:center;gap:14px;padding:0 28px 0 12px;
  border:1.5px solid rgba(160,185,240,.28);background:rgba(10,24,58,.92);white-space:nowrap}

.stp.on .l{color:#fff}
.stp.done .n{background:rgba(217,169,62,.25);color:var(--gold2)}
.stp.done .l{color:var(--ink)}
.arrow{position:absolute;top:30px;height:24px;width:40px;opacity:.7}

#hud2{left:60px;top:292px;width:960px;opacity:0}
.hudchip{position:absolute;top:0;height:64px;padding:0 24px;border-radius:32px;background:rgba(8,18,44,.88);border:1.5px solid rgba(160,185,240,.28);
  display:flex;align-items:center;gap:14px;font-family:'JBM';font-weight:700;font-size:28px}
.hudchip small{font-family:'Inter';font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--slate)}
#foot{position:absolute;left:0;top:1498px;width:1080px;text-align:center;font-weight:600;font-size:23px;letter-spacing:.13em;text-transform:uppercase;color:rgba(190,205,240,.9);opacity:0;text-shadow:0 2px 10px #000,0 0 18px #000}

/* ---------- CRM ---------- */
#crm{width:960px;height:1020px}
#crm .trk{position:absolute;left:30px;top:84px;width:900px;height:72px}
.ts{position:absolute;top:0;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 24px 0 10px;gap:12px;
  border:1.5px solid rgba(160,185,240,.26);background:rgba(8,20,50,.9);white-space:nowrap}

.ts.on{border-color:var(--gold);box-shadow:0 0 30px rgba(217,169,62,.38);background:rgba(40,32,10,.9)}

.ts.done .n{background:rgba(217,169,62,.25);color:var(--gold2)}.ts.done .l{color:var(--ink)}
#crm .rows{position:absolute;left:30px;top:176px;width:900px;height:840px}
.row{position:absolute;left:0;top:0;width:900px;height:112px;border-radius:20px;background:linear-gradient(145deg,rgba(28,52,108,.9),rgba(14,30,70,.9));
  border:1.5px solid rgba(150,178,240,.20);overflow:hidden}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:8px}
.row .l{position:absolute;left:28px;top:11px;width:560px}

.row .sub{margin-top:5px;font-weight:600;font-size:24px;color:var(--slate);white-space:nowrap}
.row .note{margin-top:5px;font-weight:400;font-size:22px;color:#AFC0E4;white-space:nowrap;height:28px}
.row .note.wait{color:var(--slate2);font-style:italic}
.row .r{position:absolute;right:20px;top:14px;width:290px}
.pill{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-bottom:12px;
  background:rgba(150,178,240,.14);color:var(--slate);border:1.5px solid rgba(150,178,240,.25)}
.pill.pg{background:linear-gradient(180deg,#F8DE93,#C99830);color:#0A1736;border-color:transparent}
.pill.blue{background:rgba(47,107,214,.35);color:#CFE0FF;border-color:rgba(110,160,255,.6)}
.gh{position:absolute;left:0;height:34px;width:900px;font-weight:700;font-size:20px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:16px}
.gh:after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,rgba(217,169,62,.7),rgba(217,169,62,0))}

/* ---------- stack panels ---------- */
.pn{position:absolute;width:900px;height:226px;border-radius:34px;overflow:hidden;
  background:linear-gradient(150deg,#14306A 0%,#0B1D45 60%,#081330 100%);border:1.5px solid rgba(180,200,245,.26);
  box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 1px rgba(217,169,62,.16),inset 0 1px 0 rgba(255,255,255,.2)}

.mini{display:flex;gap:12px}

.cl2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}

.conn{position:absolute;width:6px;height:44px;margin-left:-3px;border-radius:3px;background:linear-gradient(180deg,rgba(217,169,62,.1),rgba(244,216,138,.85),rgba(217,169,62,.1));box-shadow:0 0 18px rgba(217,169,62,.6)}

/* ---------- wordmark / cta ---------- */
#wm{position:absolute;left:0;width:1080px;top:0;text-align:center;opacity:0}
