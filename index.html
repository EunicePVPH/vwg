<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valencia Work Group Inc. — From Foundation to Finish.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    /* ─── CSS Variables ─────────────────────────────────────────── */
    :root {
      --navy:        #1E2E5C;
      --navy-dark:   #111D38;
      --red:         #C0392B;
      --orange:      #E07820;
      --white:       #FFFFFF;
      --light:       #F5F6F9;
      --warm:        #FAF7F2;
      --text:        #1A2340;
      --muted:       #6B7690;
      --border:      #DDE2EC;

      --gradient-ro: linear-gradient(90deg, var(--red), var(--orange));

      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;

      --radius: 6px;
      --shadow: 0 4px 24px rgba(30,46,92,0.10);
      --shadow-lg: 0 8px 40px rgba(30,46,92,0.15);
    }

    /* ─── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      background: var(--light);
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul, ol {
      list-style: none;
    }

    button {
      font-family: var(--font-body);
      cursor: pointer;
      border: none;
      background: none;
    }

    input, textarea, select {
      font-family: var(--font-body);
      font-size: 15px;
    }

    /* ─── Hidden utility ─────────────────────────────────────────── */
    .hidden {
      display: none !important;
    }

    /* ─── Typography helpers ─────────────────────────────────────── */
    .section-label {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--red);
      display: block;
      margin-bottom: 10px;
    }

    .section-label--light {
      color: var(--orange);
    }

    h1, h2, h3, h4 {
      font-family: var(--font-head);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 1.1;
      color: var(--navy);
    }

    h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); }
    h2 { font-size: clamp(1.8rem, 3.5vw, 2.8rem); }
    h3 { font-size: clamp(1.3rem, 2.5vw, 1.8rem); }
    h4 { font-size: 1.1rem; }

    .text-red    { color: var(--red); }
    .text-orange { color: var(--orange); }
    .text-white  { color: var(--white); }
    .text-navy   { color: var(--navy); }
    .text-muted  { color: var(--muted); }

    /* ─── Gradient stripe divider ────────────────────────────────── */
    .stripe {
      height: 6px;
      background: var(--gradient-ro);
      display: block;
      width: 100%;
    }

    /* ─── Blueprint SVG texture overlay ──────────────────────────── */
    .blueprint-overlay {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0px, transparent 1px, transparent 39px, rgba(255,255,255,0.04) 40px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, transparent 1px, transparent 39px, rgba(255,255,255,0.04) 40px);
      pointer-events: none;
    }

    /* ─── Buttons ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 13px 26px;
      border-radius: var(--radius);
      transition: opacity 0.2s, transform 0.15s;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-red {
      background: var(--red);
      color: var(--white);
    }

    .btn-orange {
      background: var(--orange);
      color: var(--white);
    }

    .btn-navy {
      background: var(--navy);
      color: var(--white);
    }

    .btn-outline-white {
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255,255,255,0.7);
    }

    .btn-outline-navy {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--navy);
    }

    /* ─── Container ──────────────────────────────────────────────── */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ─── Section spacing ────────────────────────────────────────── */
    .section {
      padding: 80px 0;
    }

    .section-sm {
      padding: 48px 0;
    }

    /* ─── Page wrapper ───────────────────────────────────────────── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Breadcrumb ─────────────────────────────────────────────── */
    .breadcrumb {
      font-family: var(--font-body);
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 12px;
    }

    .breadcrumb span { color: rgba(255,255,255,0.5); margin: 0 6px; }

    /* ─── Responsive grid helpers ────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

    @media (max-width: 960px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .section { padding: 56px 0; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      h1 { font-size: 2.2rem; }
      h2 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation injected here (Step 2) -->
  <!-- Pages injected here (Steps 4–15) -->
  <!-- Footer injected here (Step 3) -->

  <script>
    /* ─── Page navigation ──────────────────────────────────────── */
    function goTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById(pageId);
      if (target) target.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setActiveNav(pageId);
      // close mobile menu if open
      const mobileMenu = document.getElementById('mobile-menu');
      if (mobileMenu) mobileMenu.classList.remove('open');
    }

    function setActiveNav(pageId) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      const active = document.querySelector(`[data-page='${pageId}']`);
      if (active) active.classList.add('active');
    }

    /* ─── Portfolio filter ─────────────────────────────────────── */
    function filterPortfolio(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.portfolio-item').forEach(item => {
        if (category === 'all' || item.dataset.category === category) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    /* ─── Mobile menu toggle ───────────────────────────────────── */
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.toggle('open');
    }
  </script>

</body>
</html>
