<!doctype html>
<html><head><meta charset="utf-8">
<title>ProVirtual PH — Reel 09</title>
<style>
:root{
  --n9:#050f26; --n8:#081a3f; --n7:#0b2252; --navy:#12285a; --n6:#1b3a7a; --n5:#2c5296;
  --gold:#d4a84b; --gold2:#f0cf85; --gold3:#b8892f; --white:#fff; --ice:#eef2f9; --ice2:#e3e9f4;
  --slate:#5b6577; --mute:#8892a6; --char:#232c3f; --char2:#161d2e; --steel:#4b78b5; --sage:#4f8a78; --clay:#b0654a;
  --ink:#0f1b3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050f26;font-family:'Inter','Inter Display',sans-serif;-webkit-font-smoothing:antialiased}
#frame{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 38%,#0f2a62 0%,#081a3f 45%,#050f26 100%)}
#shake{position:absolute;inset:0}
#grid{position:absolute;left:-600px;top:-300px;width:2280px;height:2520px;transform-origin:50% 50%;opacity:.55;
  background-image:radial-gradient(circle,rgba(150,180,235,.55) 2.2px,transparent 2.6px);}
#grid2{position:absolute;left:-600px;top:-300px;width:2280px;height:2520px;transform-origin:50% 50%;opacity:.22;
  background-image:linear-gradient(rgba(150,180,235,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(150,180,235,.5) 1px,transparent 1px);}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1600px;perspective-origin:540px 580px}
#world{position:absolute;left:540px;top:580px;width:0;height:0;transform-style:preserve-3d}
.stn{position:absolute;width:0;height:0;transform-style:preserve-3d}
.panel{position:absolute;background:#fff;border-radius:34px;box-shadow:0 60px 120px -30px rgba(1,6,20,.75),0 0 0 2px rgba(255,255,255,.06);overflow:hidden;color:var(--ink);backface-visibility:hidden}
.panel.dark{background:linear-gradient(180deg,#1a2540,#121a2e);color:#e8edf8;box-shadow:0 60px 120px -30px rgba(1,6,20,.85),0 0 0 2px rgba(255,255,255,.08)}
.panel.cream{background:#fbf6ea}
.ph{height:104px;display:flex;align-items:center;padding:0 38px;gap:18px;font-weight:800;font-size:38px;letter-spacing:-.01em;border-bottom:2px solid #e9eef7}
.dark .ph{border-bottom-color:rgba(255,255,255,.08)}
.abs{position:absolute}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:24px;padding:7px 18px;border-radius:99px;white-space:nowrap}
.sk{background:#e6ebf4;border-radius:99px;height:16px}
.dark .sk{background:rgba(255,255,255,.12)}
.ghost{position:absolute;font-weight:900;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:3px rgba(120,160,230,.16);white-space:nowrap;line-height:1}
/* overlays */
#scrim{position:absolute;left:0;top:760px;width:1080px;height:1000px;background:linear-gradient(180deg,rgba(5,15,38,0) 0%,rgba(5,15,38,.82) 34%,rgba(5,15,38,.94) 100%);opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 62% at 50% 45%,rgba(0,0,0,0) 55%,rgba(2,6,18,.62) 100%)}
#grain{position:absolute;inset:-100px;opacity:.035;pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 42%,rgba(255,236,190,.95),rgba(212,168,75,.55) 45%,rgba(212,168,75,0) 80%);opacity:0;pointer-events:none}
#sweep{position:absolute;left:-600px;top:-300px;width:700px;height:2600px;transform:rotate(18deg);opacity:0;pointer-events:none;background:linear-gradient(90deg,rgba(212,168,75,0),rgba(255,226,160,.55),rgba(212,168,75,0))}
#txt{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.tc{position:absolute;color:#fff;font-weight:900;line-height:.96;letter-spacing:-.035em;text-shadow:0 6px 50px rgba(2,8,24,.55);white-space:nowrap}
.ln{display:block;overflow:hidden;padding:.1em .12em .14em;margin:-.1em -.12em -.14em}
.ln>.in{display:inline-block;will-change:transform}
.ch{display:inline-block}
#hud{position:absolute;left:0;top:0;width:1080px;height:260px;pointer-events:none;opacity:0}
.wm{position:absolute;left:64px;top:96px;font-weight:800;font-size:27px;letter-spacing:.34em;color:#fff}
.wm b{color:var(--gold);font-weight:800}
.tick{position:absolute;top:104px;height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.tick i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold)}
.tl{position:absolute;top:122px;font-weight:700;font-size:17px;letter-spacing:.18em;color:rgba(255,255,255,.55)}
#disc{position:absolute;left:64px;top:150px;font-weight:600;font-size:19px;letter-spacing:.12em;color:rgba(255,255,255,.4)}
</style></head>
<body>
<div id="frame"><div id="shake">
  <div id="grid"></div><div id="grid2"></div>
  <div id="cam"><div id="world"></div></div>
  <div id="scrim"></div>
  <div id="txt"></div>
  <div id="hud"></div>
  <div id="sweep"></div><div id="flash"></div>
  <div id="vig"></div>
  <canvas id="grain" width="256" height="256"></canvas>
</div></div>
<script src="core.js"></script>
<script src="ops.js"></script>
<script src="mkt.js"></script>
<script src="web.js"></script>
<script src="res.js"></script>
<script src="con.js"></script>
<script src="finale.js"></script>
<script src="main.js"></script>
</body></html>
