<!doctype html>
<html><head><meta charset="utf-8"><title>ProVirtual PH Reel 04</title>
<style>
@font-face{font-family:'Mont';src:url('fonts/montserrat-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050D1F}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:'Inter','Mont',sans-serif;color:#0B1B33;-webkit-font-smoothing:antialiased}
.abs{position:absolute;left:0;top:0}
.disp{font-family:'Mont',sans-serif;font-weight:900;text-transform:uppercase;white-space:nowrap}
.white{color:#fff}
.gold{background-image:linear-gradient(180deg,#FFEFC2 0%,#EDC36A 34%,#CC9832 68%,#96691D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
i.gold{font-style:normal}
.panel{position:absolute;overflow:hidden;background:#F4F7FB;backface-visibility:hidden}
.card{position:absolute;left:0;top:0;width:440px;height:66px;border-radius:16px;background:#F6F8FC;display:flex;align-items:center;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.5);backface-visibility:hidden}
.card .cbar{width:8px;height:100%}
.card .cic{width:42px;height:42px;border-radius:12px;margin-left:14px;display:grid;place-items:center;flex:none}
.card .ctx{margin-left:14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .ctx b{font:700 22px Inter;color:#0B1B33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.card .ctx span{font:500 15px Inter;color:#6B7A90;white-space:nowrap}
.card .cchk{width:34px;height:34px;border-radius:50%;margin-right:16px;border:2.5px solid #CBD5E3;display:grid;place-items:center;flex:none}
</style></head>
<body><div id="root"></div>
<script src="core.js"></script><script src="s1.js"></script><script src="s2.js"></script><script src="s3.js"></script><script src="s5.js"></script><script src="main.js"></script>
</body></html>
